<app-header />

<main>
  <div id="dashboard">
    
    <!-- using square brackets for property binding -->
     <!-- using curly braces for interpolation -->
      <!-- using the component as a directive, to wrap the content of the component -->
    <app-dashboard-item 
      [image]="{src: 'status.png', alt: 'A signal symbol'}" 
      [title]="'Server Status'"
    >
      <app-server-status />
    </app-dashboard-item>

    <app-dashboard-item 
      [image]="{src: 'globe.png', alt: 'A globe'}" 
      [title]="'Traffic'"
    >
      <app-traffic />
    </app-dashboard-item>

    <app-dashboard-item 
      [image]="{src: 'list.png', alt: 'A list of items'}" 
      [title]="'Support Tickets'"
    >
      <app-tickets />
    </app-dashboard-item>
  </div>
</main>
